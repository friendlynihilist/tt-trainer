<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Terza palla</title>
    <meta name="description" content="Allenamento e diario di tennistavolo: sessioni su misura del tuo livello." />
    <meta name="theme-color" content="#F2F2F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0E12" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terza palla" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Tema scelto dall'utente, applicato prima del primo disegno per evitare il lampo.
      try {
        var t = localStorage.getItem('tt-trainer:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Prima che l'app sia scaricata: lo stesso sfondo e lo stesso tavolo della schermata di caricamento. */
      html { background: #f2f2f6; }
      html[data-theme='dark'] { background: #0d0e12; }
      html[data-theme='dark'] #boot i { background: #12548f; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) { background: #0d0e12; }
        html:not([data-theme='light']) #boot i { background: #12548f; }
      }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot i { width: 132px; height: 132px; margin-bottom: 49px; border-radius: 34px; background: #1463a8; }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot" aria-hidden="true"><i></i></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
