<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Terza palla</title>
    <meta name="description" content="Allenamento e diario di tennistavolo: sessioni su misura del tuo livello." />
    <meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1012" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terza palla" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Tema scelto dall'utente, applicato prima del primo disegno per evitare il lampo.
      try {
        var t = localStorage.getItem('tt-trainer:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
